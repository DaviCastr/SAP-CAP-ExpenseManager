name: Setup BTP trial

on:
  workflow_dispatch:
    inputs:
      deploy_cap:
        description: Build and deploy the CAP application
        type: boolean
        default: true
      configure_auth:
        description: Configure the own login (token secret and first administrator)
        type: boolean
        default: true
      configure_smtp:
        description: Configure email (SMTP)
        type: boolean
        default: true
      sync_ui5:
        description: Update the UI5 URLs and publish GitHub Pages
        type: boolean
        default: true

concurrency:
  group: setup-trial
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CF_APP: ${{ vars.CF_APP || 'ExpenseManager-srv' }}
      HANA_INSTANCE: ${{ vars.HANA_INSTANCE }}
      UI5_REPOSITORY: ${{ vars.UI5_REPOSITORY || 'DaviCastr/SAP-UI5-ExpenseManager' }}
      UI5_PAGES_URL: ${{ vars.UI5_PAGES_URL || 'https://davicastr.github.io/SAP-UI5-ExpenseManager/' }}
      GIT_AUTHOR_NAME: Davi Castro
      GIT_AUTHOR_EMAIL: davifgeo@gmail.com

    steps:
      - name: Check UI5 repository token
        if: inputs.sync_ui5
        env:
          UI5_REPO_TOKEN: ${{ secrets.UI5_REPO_TOKEN }}
        run: |
          if [[ -z "$UI5_REPO_TOKEN" ]]; then
            echo "::error::Missing repository secret UI5_REPO_TOKEN (fine-grained token with Contents read and write on ${UI5_REPOSITORY})."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout UI5 repository
        if: inputs.sync_ui5
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UI5_REPOSITORY }}
          token: ${{ secrets.UI5_REPO_TOKEN }}
          path: ui5

      - name: Setup Node.js
        if: inputs.deploy_cap
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Log in to Cloud Foundry
        uses: ./.github/actions/cf-login
        with:
          api: ${{ vars.CF_API || 'https://api.cf.us10-001.hana.ondemand.com' }}
          org: ${{ vars.CF_ORG }}
          space: ${{ vars.CF_SPACE || 'dev' }}
          username: ${{ secrets.CF_USERNAME }}
          password: ${{ secrets.CF_PASSWORD }}

      - name: Start SAP HANA Cloud
        run: bash .github/scripts/start-hana.sh

      - name: Install MultiApps plugin
        if: inputs.deploy_cap
        run: cf install-plugin multiapps -r CF-Community -f

      - name: Build and deploy CAP
        if: inputs.deploy_cap
        run: bash .github/scripts/deploy-cap.sh

      - name: Configure login
        if: inputs.configure_auth
        env:
          SETTINGS_SECRET: ${{ secrets.SETTINGS_SECRET }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RESTART_APP: ${{ !inputs.configure_smtp }}
        run: bash .github/scripts/configure-auth.sh

      - name: Configure email
        if: inputs.configure_smtp
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: bash .github/scripts/configure-smtp.sh

      - name: Update UI5 runtime configuration
        if: inputs.sync_ui5
        run: bash .github/scripts/sync-ui5-config.sh
