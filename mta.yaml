_schema-version: 3.3.0
ID: ExpenseManager
version: 1.0.0
description: "Expense Manager"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - yarn
        - npx cds build --production
modules:
  - name: ExpenseManager-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands:
        - cp ../../.cdsrc.json .
      ignore:
        - node_modules
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: ExpenseManager-db
      - name: ExpenseManager-uaa

  - name: ExpenseManager-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: ExpenseManager-db
    build-parameters:
      ignore:
        - node_modules

  - name: ExpenseManager-app-router
    type: approuter.nodejs
    path: app/router
    parameters:
      disk-quota: 256M
      memory: 256M
      keep-existing-routes: true
    build-parameters:
      builder: custom
      commands:
        - yarn
      ignore:
        - node_modules
    requires:
      - name: ExpenseManager-uaa
      - name: srv-api
        group: descriptions
        properties:
          name: srv-api
          url: "~{srv-url}"
          forwardAuthToken: true
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: ExpenseManager-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      config:
        schema: EXPENSEMANAGERDB
        makeUniqueName: false
    properties:
      hdi-container-name: '${service-name}'
      hdi-service-name: '${service-name}'
  - name: ExpenseManager-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ExpenseManager-uaa-${space}
        tenant-mode: dedicated
